<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Record Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Card Container (Target ~460px by 520px) -->
  <div class="w-full max-w-[460px] min-h-[520px] bg-white rounded-2xl shadow-lg border border-slate-200/80 p-6 flex flex-col justify-between transition-all hover:shadow-xl relative overflow-hidden">
    
    <!-- Upper Content -->
    <div>
      <!-- Image Placeholder -->
      <div class="w-full h-56 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex flex-col items-center justify-center text-slate-400 group hover:border-indigo-400 hover:bg-indigo-50/30 transition-colors cursor-pointer relative overflow-hidden">
        <svg class="w-12 h-12 mb-2 text-slate-400 group-hover:text-indigo-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <span class="text-sm font-medium text-slate-500 group-hover:text-indigo-600">Image Placeholder</span>
        <span class="text-xs text-slate-400 mt-1">412 × 224 px</span>
      </div>

      <!-- Title -->
      <h2 class="mt-6 text-xl font-bold text-slate-800 tracking-tight">
        Project Alpha Documentation
      </h2>

      <!-- Secondary Info Text -->
      <p class="mt-2 text-sm text-slate-500 leading-relaxed">
        Updated 2 days ago • Category: System Records • ID: #REC-80429
      </p>
    </div>

    <!-- Bottom Action Area -->
    <div class="mt-6 pt-4 border-t border-slate-100">
      <button 
        id="archiveBtn" 
        onclick="archiveRecord()" 
        class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm rounded-xl shadow-sm transition-all duration-200 active:scale-[0.99] flex items-center justify-center gap-2"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 01-2-2V5a2 2 0 012-2h14a2 2 0 012 2v1a2 2 0 01-2 2M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path>
        </svg>
        Archive this
      </button>
    </div>

    <!-- Toast Notification for feedback -->
    <div id="toast" class="absolute top-4 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full shadow-md transition-opacity duration-300 opacity-0 pointer-events-none">
      Record archived successfully
    </div>

  </div>

  <script>
    function archiveRecord() {
      const btn = document.getElementById('archiveBtn');
      const toast = document.getElementById('toast');
      
      // Update button state
      btn.classList.remove('bg-slate-900', 'hover:bg-slate-800');
      btn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
      btn.innerHTML = `
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        Archived
      `;

      // Show toast message
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
